name: Apple Port Debug

on:
  workflow_dispatch:
    inputs:
      apple_target_device:
        description: Apple target device
        required: true
        type: choice
        default: ios-simulator
        options:
          - ios-simulator
          - ios
          - macos
      dep_target:
        description: "Dependency target to build, e.g. external_flac or install"
        required: true
        default: install
      build_host_tools:
        description: Build host tools if cache is missing
        required: true
        type: boolean
        default: false

concurrency:
  group: apple-port-debug-${{ github.ref }}-${{ inputs.apple_target_device || 'ios-simulator' }}-${{ inputs.dep_target || 'install' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CACHE_VERSION: v3
  CACHE_FEATURES: ninja-ccache-v1
  TARGET_DEVICE: ${{ inputs.apple_target_device || 'ios-simulator' }}
  DEP_TARGET: ${{ inputs.dep_target || 'install' }}
  BUILD_HOST_TOOLS: ${{ inputs.build_host_tools || false }}
  HOST_BUILD_DIR: ${{ github.workspace }}/build_darwin
  DEPS_BUILD_DIR: ${{ github.workspace }}/build_deps_debug_${{ inputs.apple_target_device || 'ios-simulator' }}
  DEPS_INSTALL_DIR: ${{ github.workspace }}/lib/debug_${{ inputs.apple_target_device || 'ios-simulator' }}_arm64
  HOST_DEPS_INSTALL_DIR: ${{ github.workspace }}/lib/macos_arm64
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1500M

jobs:
  debug-deps:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compute host libs cache key
        id: host-libs-cache-key
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD:lib/macos_arm64)" >> "$GITHUB_OUTPUT"

      - name: Restore host precompiled libs cache
        id: host-libs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .git/modules/lib/macos_arm64
            lib/macos_arm64
          key: ${{ runner.os }}-host-libs-${{ steps.host-libs-cache-key.outputs.sha }}-v1

      - name: Fetch host precompiled libs
        if: steps.host-libs-cache.outputs.cache-hit != 'true'
        run: |
          python3 ./build_files/utils/make_update.py --no-blender

      - name: Save host precompiled libs cache
        if: steps.host-libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .git/modules/lib/macos_arm64
            lib/macos_arm64
          key: ${{ runner.os }}-host-libs-${{ steps.host-libs-cache-key.outputs.sha }}-v1

      - name: Install dependency build prerequisites
        run: |
          missing=()
          for pkg in autoconf automake bison ccache dos2unix flex libtool meson ninja pkg-config yasm; do
            brew list "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install "${missing[@]}"
          fi
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v aclocal)" "$HOME/.local/bin/aclocal-1.16"
          ln -sf "$(command -v automake)" "$HOME/.local/bin/automake-1.16"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libtool)/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          ninja --version
          echo "Target device: ${TARGET_DEVICE}"
          echo "Dependency target: ${DEP_TARGET}"
          echo "Build host tools: ${BUILD_HOST_TOOLS}"

      - name: Restore compiler cache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: apple-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'build_files/build_environment/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apple-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'build_files/build_environment/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**') }}-
            apple-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          ccache --version
          ccache --set-config=max_size="${CCACHE_MAXSIZE}"
          ccache --zero-stats || true
          ccache --show-config

      - name: Restore host tools build cache
        id: restore-host-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.HOST_BUILD_DIR }}
          key: host-tools-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**') }}

      - name: Build host tools
        if: steps.restore-host-tools-cache.outputs.cache-hit != 'true'
        run: |
          make tools \
            BUILD_DIR="${HOST_BUILD_DIR}" \
            BUILD_CMAKE_ARGS="-G Ninja -DWITH_COMPILER_CCACHE=YES"

      - name: Verify host tools
        if: always()
        run: |
          test -x "${HOST_BUILD_DIR}/bin/datatoc"
          test -x "${HOST_BUILD_DIR}/bin/shader_tool"
          test -x "${HOST_BUILD_DIR}/bin/makesdna"
          test -x "${HOST_BUILD_DIR}/bin/makesrna"
          test -x "${HOST_BUILD_DIR}/bin/msgfmt"

      - name: Save host tools build cache
        if: steps.restore-host-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.HOST_BUILD_DIR }}
          key: host-tools-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**') }}

      - name: Restore deps source cache
        id: restore-deps-source-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DEPS_BUILD_DIR }}/downloads
            ${{ env.DEPS_BUILD_DIR }}/packages
          key: apple-deps-source-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('build_files/build_environment/cmake/download.cmake', 'build_files/build_environment/cmake/versions.cmake') }}
          restore-keys: |
            apple-deps-source-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-

      - name: Restore deps debug state cache
        id: restore-deps-state-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DEPS_BUILD_DIR }}/CMakeCache.txt
            ${{ env.DEPS_BUILD_DIR }}/CMakeFiles
            ${{ env.DEPS_BUILD_DIR }}/build.ninja
            ${{ env.DEPS_BUILD_DIR }}/rules.ninja
            ${{ env.DEPS_BUILD_DIR }}/.ninja_deps
            ${{ env.DEPS_BUILD_DIR }}/.ninja_log
            ${{ env.DEPS_BUILD_DIR }}/Release
            ${{ env.DEPS_BUILD_DIR }}/build
            ${{ env.DEPS_INSTALL_DIR }}
          key: apple-deps-debug-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ env.TARGET_DEVICE }}-${{ hashFiles('GNUmakefile', 'build_files/build_environment/**') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apple-deps-debug-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ env.TARGET_DEVICE }}-${{ hashFiles('GNUmakefile', 'build_files/build_environment/**') }}-

      - name: Build deps via GNUmakefile wrapper
        run: |
          make deps "${TARGET_DEVICE}" \
            DEPS_TARGET="${DEP_TARGET}" \
            DEPS_BUILD_DIR="${DEPS_BUILD_DIR}" \
            DEPS_INSTALL_DIR="${DEPS_INSTALL_DIR}" \
            DEPS_CMAKE_ARGS="-G Ninja -DWITH_COMPILER_CCACHE=ON" \
            CROSSCOMPILE_BUILD_DIR="${HOST_BUILD_DIR}" \
            CROSSCOMPILE_DEPS_INSTALL_DIR="${HOST_DEPS_INSTALL_DIR}"

      - name: Save deps source cache
        if: always() && steps.restore-deps-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DEPS_BUILD_DIR }}/downloads
            ${{ env.DEPS_BUILD_DIR }}/packages
          key: apple-deps-source-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('build_files/build_environment/cmake/download.cmake', 'build_files/build_environment/cmake/versions.cmake') }}

      - name: Save deps debug state cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DEPS_BUILD_DIR }}/CMakeCache.txt
            ${{ env.DEPS_BUILD_DIR }}/CMakeFiles
            ${{ env.DEPS_BUILD_DIR }}/build.ninja
            ${{ env.DEPS_BUILD_DIR }}/rules.ninja
            ${{ env.DEPS_BUILD_DIR }}/.ninja_deps
            ${{ env.DEPS_BUILD_DIR }}/.ninja_log
            ${{ env.DEPS_BUILD_DIR }}/Release
            ${{ env.DEPS_BUILD_DIR }}/build
            ${{ env.DEPS_INSTALL_DIR }}
          key: apple-deps-debug-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ env.TARGET_DEVICE }}-${{ hashFiles('GNUmakefile', 'build_files/build_environment/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Show compiler cache stats
        if: always()
        run: |
          ccache --show-stats || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: apple-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'build_files/build_environment/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload dep debug artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: apple-port-debug-${{ env.TARGET_DEVICE }}-${{ env.DEP_TARGET }}-logs
          if-no-files-found: ignore
          path: |
            ${{ env.DEPS_BUILD_DIR }}/CMakeCache.txt
            ${{ env.DEPS_BUILD_DIR }}/CMakeFiles/CMakeError.log
            ${{ env.DEPS_BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.DEPS_BUILD_DIR }}/build/**/CMakeFiles/CMakeError.log
            ${{ env.DEPS_BUILD_DIR }}/build/**/CMakeFiles/CMakeOutput.log
            ${{ env.DEPS_BUILD_DIR }}/build/**/config.log
            ${{ env.DEPS_BUILD_DIR }}/build/**/src/*-stamp/*.log

      - name: Summarize outputs
        if: always()
        run: |
          echo "Built target: ${DEP_TARGET}"
          echo "Target device: ${TARGET_DEVICE}"
          echo "Host tools cache hit: ${{ steps.restore-host-tools-cache.outputs.cache-hit }}"
          echo "Compiler cache hit: ${{ steps.restore-ccache.outputs.cache-hit }}"
          echo "Deps source cache hit: ${{ steps.restore-deps-source-cache.outputs.cache-hit }}"
          echo "Deps state cache hit: ${{ steps.restore-deps-state-cache.outputs.cache-hit }}"
