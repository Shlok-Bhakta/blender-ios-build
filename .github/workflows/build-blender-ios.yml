name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf ~/Library/Android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles
          sudo xcrun simctl delete all 2>/dev/null || true
          df -h

      - name: Install dependencies
        run: brew install git-lfs cmake eigen fmt openimageio zstd python@3.13 libepoxy

      - name: Initialize Git LFS
        run: git lfs install

      - name: Compute required LFS cache key
        id: required-lfs-cache-key
        run: printf 'sha=%s\n' "$(git rev-parse HEAD:release/datafiles/startup.blend)" >> "$GITHUB_OUTPUT"

      - name: Restore required LFS assets cache
        id: required-lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .git/lfs/objects
            release/datafiles/startup.blend
          key: ${{ runner.os }}-required-lfs-${{ steps.required-lfs-cache-key.outputs.sha }}-v1

      - name: Fetch required LFS source assets
        run: |
          if [ "${{ steps.required-lfs-cache.outputs.cache-hit }}" != "true" ]; then
            git config lfs.remote.searchall true
            git remote add lfs-fallback https://projects.blender.org/blender/blender.git 2>/dev/null || true
            git remote set-url --push lfs-fallback no_push
            git lfs fetch lfs-fallback --include="release/datafiles/startup.blend"
          fi
          git lfs pull --include="release/datafiles/startup.blend"

      - name: Save required LFS assets cache
        if: steps.required-lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .git/lfs/objects
            release/datafiles/startup.blend
          key: ${{ runner.os }}-required-lfs-${{ steps.required-lfs-cache-key.outputs.sha }}-v1

      - name: Compute iOS libs cache key
        id: ios-libs-cache-key
        run: printf 'sha=%s\n' "$(git rev-parse HEAD:lib/ios_arm64)" >> "$GITHUB_OUTPUT"

      - name: Restore iOS prebuilt libraries cache
        id: ios-libs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ${{ runner.os }}-ios-arm64-libs-${{ steps.ios-libs-cache-key.outputs.sha }}-bootstrap-v3

      - name: Fetch prebuilt iOS libraries
        if: steps.ios-libs-cache.outputs.cache-hit != 'true'
        run: |
          python3 ./build_files/utils/make_update.py --use-ios-libraries || true

      - name: Bootstrap missing iOS prebuilts
        run: |
          if [ ! -f lib/ios_arm64/fmt/include/fmt/core.h ]; then
            bash ./build_files/utils/bootstrap_ios_fmt.sh
          fi
          if [ ! -f lib/ios_arm64/eigen/share/eigen3/cmake/Eigen3Config.cmake ]; then
            bash ./build_files/utils/bootstrap_ios_eigen.sh
          fi

      - name: Save iOS prebuilt libraries cache
        if: steps.ios-libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ${{ runner.os }}-ios-arm64-libs-${{ steps.ios-libs-cache-key.outputs.sha }}-bootstrap-v3

      - name: Verify bootstrapped iOS prebuilts
        run: |
          if [ ! -f lib/ios_arm64/fmt/include/fmt/core.h ]; then
            echo "ERROR: fmt not found in lib/ios_arm64 after bootstrap." >&2
            exit 1
          fi
          if [ ! -f lib/ios_arm64/eigen/share/eigen3/cmake/Eigen3Config.cmake ]; then
            echo "ERROR: Eigen3 config not found in lib/ios_arm64 after bootstrap." >&2
            exit 1
          fi

      - name: Compute Xcode project cache key
        id: xcode-cache-key
        run: |
          CMAKE_FLAGS="APPLE_TARGET_DEVICE=ios,WITH_XR_OPENXR=OFF,WITH_RUBBERBAND=OFF,WITH_LIBMV=OFF,WITH_LIBMV_SCHUR_SPECIALIZATIONS=OFF"
          KEY="${{ runner.os }}-xcode-${{ hashFiles('**/CMakeLists.txt', '**/*.cmake') }}-$(echo $CMAKE_FLAGS | sha256sum | cut -c1-8)"
          echo "key=$KEY" >> "$GITHUB_OUTPUT"

      - name: Restore Xcode project cache
        id: xcode-cache
        uses: actions/cache/restore@v4
        with:
          path: build_ios
          key: ${{ steps.xcode-cache-key.outputs.key }}

      - name: Generate Xcode project
        if: steps.xcode-cache.outputs.cache-hit != 'true'
        run: |
          PYTHON_INC=$(python3 -c "import sysconfig; print(sysconfig.get_path('include'))")
          cmake -G Xcode -S . -B build_ios \
            -DAPPLE_TARGET_DEVICE=ios \
            -DWITH_XR_OPENXR=OFF \
            -DWITH_RUBBERBAND=OFF \
            -DWITH_LIBMV=OFF \
            -DWITH_LIBMV_SCHUR_SPECIALIZATIONS=OFF \
            -DPYTHON_INCLUDE_DIR="$PYTHON_INC"

      - name: Save Xcode project cache
        if: steps.xcode-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build_ios
          key: ${{ steps.xcode-cache-key.outputs.key }}

      - name: List Xcode targets
        run: xcodebuild -project build_ios/Blender.xcodeproj -list

      - name: Build cross-compilation tools (native macOS build)
        run: |
          echo "=== Building cross-compilation tools natively on macOS ==="
          rm -rf build_ios/build_darwin_tools
          
          # Create fake lib/macos_arm64/.git to satisfy platform_apple.cmake check
          mkdir -p lib/macos_arm64/.git
          
          cmake -S . -B build_ios/build_darwin_tools \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Darwin \
            -DAPPLE_TARGET_DEVICE=macos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_FLAGS="-DWITH_CROSSCOMPILED_TOOLS" \
            -DCMAKE_CXX_FLAGS="-DWITH_CROSSCOMPILED_TOOLS" \
            -DWITH_CROSSCOMPILED_TOOLS=ON \
            -DWITH_BLENDER=ON \
            -DWITH_PYTHON=OFF \
            -DWITH_GHOST=OFF \
            -DWITH_INPUT_NDOF=OFF \
            -DWITH_JACK=OFF \
            -DWITH_LLVM=OFF \
            -DWITH_OPENCOLMAP=OFF \
            -DWITH_OPENEXR=OFF \
            -DWITH_OPENGL_BACKEND=OFF \
            -DWITH_SDL=OFF \
            -DWITH_VULKAN=OFF \
            -DWITH_GPU=OFF \
            -DWITH_GPU_BACKEND_TESTS=OFF \
            -DWITH_GPU_COMPOSITOR_TESTS=OFF \
            -DWITH_GPU_DRAW_TESTS=OFF \
            -DWITH_GPU_MESH_PAINT_TESTS=OFF \
            -DWITH_GPU_RENDER_TESTS=OFF \
            -DWITH_GPU_RENDER_TESTS_HEADED=OFF \
            -DWITH_GPU_SHADER_ASSERT=OFF \
            -DWITH_GPU_SHADER_CPP_COMPILATION=OFF \
            -DWITH_USD=OFF \
            -DWITH_OPENCOLLADA=OFF \
            -DWITH_AUDASPACE=OFF \
            -DWITH_CYCLES=OFF \
            -DWITH_HYDRA=OFF \
            -DWITH_XR_OPENXR=OFF \
            -DWITH_RUBBERBAND=OFF \
            -DWITH_LIBMV=OFF \
            -DWITH_LIBMV_SCHUR_SPECIALIZATIONS=OFF \
            -DWITH_INSTALL_PORTAL=OFF \
            -DWITH_ALEMBIC=OFF \
            -DWITH_BOOST=OFF \
            -DWITH_DRACO=OFF \
            -DWITH_FFTW3=OFF \
            -DWITH_FREESTYLE=OFF \
            -DWITH_GMP=OFF \
            -DWITH_HARU=OFF \
            -DWITH_IMAGE_CINEON=OFF \
            -DWITH_IMAGE_OPENEXR=OFF \
            -DWITH_IMAGE_OPENJPEG=OFF \
            -DWITH_IMAGE_WEBP=OFF \
            -DWITH_INTERNATIONAL=OFF \
            -DWITH_IO_FBX=OFF \
            -DWITH_IO_GREASE_PENCIL=OFF \
            -DWITH_IO_PLY=OFF \
            -DWITH_IO_STL=OFF \
            -DWITH_IO_WAVEFRONT_OBJ=OFF \
            -DWITH_MOD_FLUID=OFF \
            -DWITH_MOD_OCEANSIM=OFF \
            -DWITH_MOD_REMESH=OFF \
            -DWITH_NANOVDB=OFF \
            -DWITH_OPENVDB=OFF \
            -DWITH_QUADRIFLOW=OFF \
            -DWITH_UV_SLIM=OFF \
            -DWITH_POTRACE=OFF \
            -DWITH_PUGIXML=OFF \
            -DWITH_OPENSUBDIV=OFF \
            -DWITH_OPENVDB_3_ABI_COMPATIBLE=OFF \
            -DWITH_OPENVDB_BLOSC=OFF \
            -DWITH_MANIFOLD=OFF \
            -DWITH_MATERIALX=OFF \
            -DWITH_OPENIMAGEDENOISE=OFF \
            -DWITH_OPENCOLORIO=OFF \
            -DWITH_OPENAL=OFF \
            -DWITH_BULLET=OFF \
            -DWITH_TBB=OFF \
            -DWITH_TBB_MALLOC_PROXY=OFF \
            -DWITH_ASSERT_RELEASE=OFF \
            -DWITH_ASSERT_ABORT=ON \
            -Dsse2neon_ROOT=${PWD}/lib/ios_arm64/sse2neon
          
          cmake --build build_ios/build_darwin_tools --target makesdna makesrna datatoc shader_tool
          
          echo "=== Checking cross-compile tools ==="
          ls -la build_ios/build_darwin_tools/bin/ 2>&1 || echo "bin dir not found"
          
          echo "=== Copying tools to expected location for iOS build ==="
          # The iOS build expects tools at ../build_ios/build_darwin_tools/Release/bin/
          # relative to CMAKE_SOURCE_DIR, which is the repo root
          # So from the repo root, that's ../build_ios/build_darwin_tools/Release/bin/
          # But we're already in the repo, so we need to create the structure
          mkdir -p build_ios/build_darwin_tools/Release/bin/
          cp -v build_ios/build_darwin_tools/bin/* build_ios/build_darwin_tools/Release/bin/ || echo "No tools to copy"
          ls -la build_ios/build_darwin_tools/Release/bin/
          
          echo "=== Creating dummy GNUmakefile for iOS build ==="
          # The blender_cross_tools_compile target runs 'make tools'
          # We already built the tools, so create a dummy makefile that does nothing
          printf '.PHONY: tools\ntools:\n\t@echo "Tools already built, skipping"\n' > GNUmakefile

      - name: Build Blender.app for iOS
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      - name: Package unsigned IPA
        run: |
          APP="build_ios/bin/Release/Blender.app"
          echo "Found app at: $APP"
          ls -la "$APP" || (echo "App not found, searching..." && find build_ios -name "*.app" -type d)
          du -sh "$APP"
          rm -rf "$APP/Assets/5.0/python/lib/python3.11/config-3.11-darwin"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/
          ls -lh ../Blender.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_ios/**/*.log
            build_ios/**/*.txt
          retention-days: 7
