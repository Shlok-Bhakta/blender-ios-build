name: Apple Port Build

on:
  workflow_dispatch:
    inputs:
      apple_target_device:
        description: Apple target device
        required: true
        type: choice
        default: ios-simulator
        options:
          - ios-simulator
          - ios
          - macos
      dep_target:
        description: "`install` for full chain, or one `external_*` ninja target"
        required: true
        default: install
  push:
    branches:
      - main-iosport
    paths:
      - .github/workflows/apple-port-build.yml
      - CMakeLists.txt
      - GNUmakefile
      - build_files/**
      - tools/ios/**
      - source/blender/blentranslation/msgfmt/CMakeLists.txt
      - source/blender/datatoc/CMakeLists.txt
      - source/blender/gpu/shader_tool/CMakeLists.txt
      - source/blender/makesdna/intern/CMakeLists.txt
      - source/blender/makesrna/intern/CMakeLists.txt

concurrency:
  group: apple-port-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CACHE_VERSION: v3
  CACHE_FEATURES: ninja-ccache-v1
  TARGET_DEVICE: ${{ github.event.inputs.apple_target_device || 'ios-simulator' }}
  DEP_TARGET: ${{ github.event.inputs.dep_target || 'install' }}
  HOST_BUILD_DIR: ${{ github.workspace }}/build_darwin
  DEPS_BUILD_DIR: ${{ github.workspace }}/build_deps_${{ github.event.inputs.apple_target_device || 'ios-simulator' }}
  DEPS_INSTALL_DIR: ${{ github.workspace }}/lib/${{ github.event.inputs.apple_target_device || 'ios-simulator' }}_arm64
  HOST_DEPS_INSTALL_DIR: ${{ github.workspace }}/lib/macos_arm64
  IOS_DEPS_BUILD_DIR: ${{ github.workspace }}/build/ios-deps/ios_simulator
  IOS_DEPS_INSTALL_DIR: ${{ github.workspace }}/build/ios-deps/install/ios_simulator
  IOS_HOST_BUILD_DIR: ${{ github.workspace }}/build_darwin
  IOS_HOST_INSTALL_DIR: ${{ github.workspace }}/lib/macos_arm64
  IOS_SIM_DEPS_RELEASE_TAG: ${{ github.ref_name }}-sim-deps
  IOS_DEVICE_DEPS_RELEASE_TAG: ${{ github.ref_name }}-ios-deps
  WITH_COMPILER_CCACHE: ON
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 1500M

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compute required LFS cache key
        id: required-lfs-cache-key
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD:release/datafiles/startup.blend)" >> "$GITHUB_OUTPUT"

      - name: Restore required LFS assets cache
        id: required-lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .git/lfs/objects
            release/datafiles/startup.blend
          key: ${{ runner.os }}-required-lfs-${{ steps.required-lfs-cache-key.outputs.sha }}-v1

      - name: Fetch required LFS source assets
        run: |
          if [ "${{ steps.required-lfs-cache.outputs.cache-hit }}" != "true" ]; then
            git config lfs.remote.searchall true
            git remote get-url lfs-fallback >/dev/null 2>&1 || \
              git remote add lfs-fallback https://projects.blender.org/blender/blender.git
            git remote set-url --push lfs-fallback no_push
            git lfs fetch lfs-fallback --include="release/datafiles/startup.blend"
          fi
          git lfs pull --include="release/datafiles/startup.blend"

      - name: Save required LFS assets cache
        if: steps.required-lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .git/lfs/objects
            release/datafiles/startup.blend
          key: ${{ runner.os }}-required-lfs-${{ steps.required-lfs-cache-key.outputs.sha }}-v1

      - name: Compute host libs cache key
        id: host-libs-cache-key
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD:lib/macos_arm64)" >> "$GITHUB_OUTPUT"

      - name: Restore host precompiled libs cache
        id: host-libs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .git/modules/lib/macos_arm64
            lib/macos_arm64
          key: ${{ runner.os }}-host-libs-${{ steps.host-libs-cache-key.outputs.sha }}-v1

      - name: Fetch host precompiled libs
        if: steps.host-libs-cache.outputs.cache-hit != 'true'
        run: |
          python3 ./build_files/utils/make_update.py --no-blender

      - name: Save host precompiled libs cache
        if: steps.host-libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .git/modules/lib/macos_arm64
            lib/macos_arm64
          key: ${{ runner.os }}-host-libs-${{ steps.host-libs-cache-key.outputs.sha }}-v1

      - name: Install dependency build prerequisites
        run: |
          missing=()
          for pkg in autoconf automake bison ccache dos2unix flex libtool meson ninja pkg-config yasm; do
            brew list "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install "${missing[@]}"
          fi
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v aclocal)" "$HOME/.local/bin/aclocal-1.16"
          ln -sf "$(command -v automake)" "$HOME/.local/bin/automake-1.16"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libtool)/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          ninja --version
          command -v gh && gh --version || echo "gh not found"

      - name: Restore compiler cache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: apple-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'build_files/build_environment/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**', 'tools/ios/**') }}-stable
          restore-keys: |
            apple-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'build_files/build_environment/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**', 'tools/ios/**') }}-
            apple-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          ccache --version
          ccache --set-config=max_size="${CCACHE_MAXSIZE}"
          ccache --zero-stats || true
          ccache --show-config

      - name: Restore host tools build cache
        id: restore-host-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.HOST_BUILD_DIR }}
          key: host-tools-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**') }}

      - name: Build host tools
        if: steps.restore-host-tools-cache.outputs.cache-hit != 'true'
        run: |
          make tools \
            BUILD_DIR="${HOST_BUILD_DIR}" \
            BUILD_CMAKE_ARGS="-G Ninja -DWITH_COMPILER_CCACHE=YES"

      - name: Verify host tools
        run: |
          test -x "${HOST_BUILD_DIR}/bin/datatoc"
          test -x "${HOST_BUILD_DIR}/bin/shader_tool"
          test -x "${HOST_BUILD_DIR}/bin/makesdna"
          test -x "${HOST_BUILD_DIR}/bin/makesrna"
          test -x "${HOST_BUILD_DIR}/bin/msgfmt"

      - name: Save host tools build cache
        if: steps.restore-host-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.HOST_BUILD_DIR }}
          key: host-tools-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**') }}

      - name: Restore deps source cache (iOS simulator)
        id: restore-ios-deps-source-cache
        if: env.TARGET_DEVICE == 'ios-simulator'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.IOS_DEPS_BUILD_DIR }}/downloads
            ${{ env.IOS_DEPS_BUILD_DIR }}/packages
          key: apple-ios-sim-deps-source-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('build_files/build_environment/cmake/download.cmake', 'build_files/build_environment/cmake/versions.cmake') }}
          restore-keys: |
            apple-ios-sim-deps-source-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-

      - name: Restore deps source cache (GNUmakefile layout)
        id: restore-deps-source-cache
        if: env.TARGET_DEVICE != 'ios-simulator'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DEPS_BUILD_DIR }}/downloads
            ${{ env.DEPS_BUILD_DIR }}/packages
          key: apple-deps-source-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('build_files/build_environment/cmake/download.cmake', 'build_files/build_environment/cmake/versions.cmake') }}
          restore-keys: |
            apple-deps-source-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-

      - name: Restore deps state cache
        id: restore-deps-cache
        if: env.TARGET_DEVICE != 'ios-simulator'
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DEPS_BUILD_DIR }}/CMakeCache.txt
            ${{ env.DEPS_BUILD_DIR }}/CMakeFiles
            ${{ env.DEPS_BUILD_DIR }}/build.ninja
            ${{ env.DEPS_BUILD_DIR }}/rules.ninja
            ${{ env.DEPS_BUILD_DIR }}/.ninja_deps
            ${{ env.DEPS_BUILD_DIR }}/.ninja_log
            ${{ env.DEPS_BUILD_DIR }}/Release
            ${{ env.DEPS_BUILD_DIR }}/build
            ${{ env.DEPS_INSTALL_DIR }}
          key: deps-state-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ env.TARGET_DEVICE }}-${{ hashFiles('GNUmakefile', 'build_files/build_environment/**') }}
          restore-keys: |
            deps-state-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ env.TARGET_DEVICE }}-${{ hashFiles('GNUmakefile', 'build_files/build_environment/**') }}-

      - name: Configure iOS simulator dependency build
        if: env.TARGET_DEVICE == 'ios-simulator'
        env:
          APPLE_TARGET_DEVICE: ios-simulator
          APPLE_IOS_DEPS_BUILD_ROOT: build/ios-deps/ios_simulator
          IOS_DEPS_RELEASE_TAG: ${{ env.IOS_SIM_DEPS_RELEASE_TAG }}
        run: |
          mkdir -p artifacts/ios-deps
          python3 tools/ios/build_deps.py --mode ios-simulator --configure-only \
            --generator Ninja \
            --build-dir "${IOS_DEPS_BUILD_DIR}" \
            --install-dir "${IOS_DEPS_INSTALL_DIR}" \
            --host-build-dir "${HOST_BUILD_DIR}" \
            --host-install-dir "${HOST_DEPS_INSTALL_DIR}" \
            --log-dir artifacts/ios-deps/configure-logs \
            --manifest-path artifacts/ios-deps/configure-manifest.json \
            --cmake-arg=-DWITH_COMPILER_CCACHE=ON

      - name: Build iOS simulator dependencies (GitHub Release cache)
        if: env.TARGET_DEVICE == 'ios-simulator' && env.DEP_TARGET == 'install'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TARGET_DEVICE: ios-simulator
          APPLE_IOS_DEPS_BUILD_ROOT: build/ios-deps/ios_simulator
          IOS_DEPS_RELEASE_TAG: ${{ env.IOS_SIM_DEPS_RELEASE_TAG }}
        run: |
          bash tools/ios/run_cached_deps_all.sh

      - name: Build single iOS simulator dependency (GitHub Release cache)
        if: env.TARGET_DEVICE == 'ios-simulator' && env.DEP_TARGET != 'install'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TARGET_DEVICE: ios-simulator
          APPLE_IOS_DEPS_BUILD_ROOT: build/ios-deps/ios_simulator
          IOS_DEPS_RELEASE_TAG: ${{ env.IOS_SIM_DEPS_RELEASE_TAG }}
        run: |
          mkdir -p artifacts/ios-deps
          short="${DEP_TARGET#external_}"
          logdir="artifacts/ios-deps/${short}-logs"
          mkdir -p "$logdir"
          bash tools/ios/run_release_cached_dep.sh "$short" artifacts/ios-deps \
            python3 tools/ios/build_deps.py --mode ios-simulator --generator Ninja \
            --build-dir "${IOS_DEPS_BUILD_DIR}" \
            --install-dir "${IOS_DEPS_INSTALL_DIR}" \
            --host-build-dir "${HOST_BUILD_DIR}" \
            --host-install-dir "${HOST_DEPS_INSTALL_DIR}" \
            --cmake-arg=-DWITH_COMPILER_CCACHE=ON \
            --build-target "${DEP_TARGET}" \
            --log-dir "$logdir" \
            --manifest-path "artifacts/ios-deps/${short}-manifest.json"

      - name: Configure iOS device dependency build
        if: env.TARGET_DEVICE == 'ios'
        env:
          APPLE_TARGET_DEVICE: ios
          APPLE_IOS_DEPS_BUILD_ROOT: ${{ env.DEPS_BUILD_DIR }}
          IOS_DEPS_RELEASE_TAG: ${{ env.IOS_DEVICE_DEPS_RELEASE_TAG }}
        run: |
          mkdir -p artifacts/ios-deps
          python3 tools/ios/build_deps.py --mode ios --configure-only \
            --generator Ninja \
            --build-dir "${DEPS_BUILD_DIR}" \
            --install-dir "${DEPS_INSTALL_DIR}" \
            --host-build-dir "${HOST_BUILD_DIR}" \
            --host-install-dir "${HOST_DEPS_INSTALL_DIR}" \
            --log-dir artifacts/ios-deps/configure-logs \
            --manifest-path artifacts/ios-deps/configure-manifest.json \
            --cmake-arg=-DWITH_COMPILER_CCACHE=ON

      - name: Build iOS device dependencies (GitHub Release cache)
        if: env.TARGET_DEVICE == 'ios' && env.DEP_TARGET == 'install'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TARGET_DEVICE: ios
          APPLE_IOS_DEPS_BUILD_ROOT: ${{ env.DEPS_BUILD_DIR }}
          IOS_DEPS_BUILD_DIR: ${{ env.DEPS_BUILD_DIR }}
          IOS_DEPS_INSTALL_DIR: ${{ env.DEPS_INSTALL_DIR }}
          IOS_HOST_BUILD_DIR: ${{ env.HOST_BUILD_DIR }}
          IOS_HOST_INSTALL_DIR: ${{ env.HOST_DEPS_INSTALL_DIR }}
          IOS_DEPS_RELEASE_TAG: ${{ env.IOS_DEVICE_DEPS_RELEASE_TAG }}
        run: |
          bash tools/ios/run_cached_deps_all.sh

      - name: Build single iOS device dependency (GitHub Release cache)
        if: env.TARGET_DEVICE == 'ios' && env.DEP_TARGET != 'install'
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TARGET_DEVICE: ios
          APPLE_IOS_DEPS_BUILD_ROOT: ${{ env.DEPS_BUILD_DIR }}
          IOS_DEPS_RELEASE_TAG: ${{ env.IOS_DEVICE_DEPS_RELEASE_TAG }}
        run: |
          mkdir -p artifacts/ios-deps
          short="${DEP_TARGET#external_}"
          logdir="artifacts/ios-deps/${short}-logs"
          mkdir -p "$logdir"
          bash tools/ios/run_release_cached_dep.sh "$short" artifacts/ios-deps \
            python3 tools/ios/build_deps.py --mode ios --generator Ninja \
            --build-dir "${DEPS_BUILD_DIR}" \
            --install-dir "${DEPS_INSTALL_DIR}" \
            --host-build-dir "${HOST_BUILD_DIR}" \
            --host-install-dir "${HOST_DEPS_INSTALL_DIR}" \
            --cmake-arg=-DWITH_COMPILER_CCACHE=ON \
            --build-target "${DEP_TARGET}" \
            --log-dir "$logdir" \
            --manifest-path "artifacts/ios-deps/${short}-manifest.json"

      - name: Sync iOS simulator install tree to lib/
        if: env.TARGET_DEVICE == 'ios-simulator'
        run: |
          mkdir -p "${DEPS_INSTALL_DIR}"
          rsync -a --delete "${IOS_DEPS_INSTALL_DIR}/" "${DEPS_INSTALL_DIR}/"

      - name: Build deps via GNUmakefile wrapper
        if: env.TARGET_DEVICE == 'macos'
        run: |
          make deps "${TARGET_DEVICE}" \
            DEPS_TARGET="${DEP_TARGET}" \
            DEPS_BUILD_DIR="${DEPS_BUILD_DIR}" \
            DEPS_INSTALL_DIR="${DEPS_INSTALL_DIR}" \
            DEPS_CMAKE_ARGS="-G Ninja -DWITH_COMPILER_CCACHE=ON" \
            CROSSCOMPILE_BUILD_DIR="${HOST_BUILD_DIR}" \
            CROSSCOMPILE_DEPS_INSTALL_DIR="${HOST_DEPS_INSTALL_DIR}"

      - name: Save deps source cache (iOS simulator)
        if: always() && env.TARGET_DEVICE == 'ios-simulator' && steps.restore-ios-deps-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.IOS_DEPS_BUILD_DIR }}/downloads
            ${{ env.IOS_DEPS_BUILD_DIR }}/packages
          key: apple-ios-sim-deps-source-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('build_files/build_environment/cmake/download.cmake', 'build_files/build_environment/cmake/versions.cmake') }}

      - name: Save deps source cache (GNUmakefile layout)
        if: always() && env.TARGET_DEVICE != 'ios-simulator' && steps.restore-deps-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DEPS_BUILD_DIR }}/downloads
            ${{ env.DEPS_BUILD_DIR }}/packages
          key: apple-deps-source-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('build_files/build_environment/cmake/download.cmake', 'build_files/build_environment/cmake/versions.cmake') }}

      - name: Save deps state cache
        if: always() && env.TARGET_DEVICE != 'ios-simulator'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DEPS_BUILD_DIR }}/CMakeCache.txt
            ${{ env.DEPS_BUILD_DIR }}/CMakeFiles
            ${{ env.DEPS_BUILD_DIR }}/build.ninja
            ${{ env.DEPS_BUILD_DIR }}/rules.ninja
            ${{ env.DEPS_BUILD_DIR }}/.ninja_deps
            ${{ env.DEPS_BUILD_DIR }}/.ninja_log
            ${{ env.DEPS_BUILD_DIR }}/Release
            ${{ env.DEPS_BUILD_DIR }}/build
            ${{ env.DEPS_INSTALL_DIR }}
          key: deps-state-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ env.TARGET_DEVICE }}-${{ hashFiles('GNUmakefile', 'build_files/build_environment/**') }}

      - name: Show compiler cache stats
        if: always()
        run: |
          ccache --show-stats || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: apple-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'build_files/build_environment/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**', 'tools/ios/**') }}-stable

      - name: Summarize outputs
        if: always()
        run: |
          echo "Built target: ${DEP_TARGET}"
          echo "Target device: ${TARGET_DEVICE}"
          echo "Compiler cache hit: ${{ steps.restore-ccache.outputs.cache-hit }}"
          echo "Host tools cache hit: ${{ steps.restore-host-tools-cache.outputs.cache-hit }}"
          if [ "${TARGET_DEVICE}" = "ios-simulator" ]; then
            echo "Deps source cache hit: ${{ steps.restore-ios-deps-source-cache.outputs.cache-hit }}"
            echo "iOS simulator release tag: ${IOS_SIM_DEPS_RELEASE_TAG}"
            ls "${DEPS_INSTALL_DIR}" || true
          elif [ "${TARGET_DEVICE}" = "ios" ]; then
            echo "Deps source cache hit: ${{ steps.restore-deps-source-cache.outputs.cache-hit }}"
            echo "Deps state cache hit: ${{ steps.restore-deps-cache.outputs.cache-hit }}"
            echo "iOS device release tag: ${IOS_DEVICE_DEPS_RELEASE_TAG}"
            ls "${DEPS_INSTALL_DIR}" || true
          else
            echo "Deps source cache hit: ${{ steps.restore-deps-source-cache.outputs.cache-hit }}"
            echo "Deps state cache hit: ${{ steps.restore-deps-cache.outputs.cache-hit }}"
            ls "${DEPS_INSTALL_DIR}" || true
          fi
