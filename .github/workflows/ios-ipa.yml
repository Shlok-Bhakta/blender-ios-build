name: iOS IPA

on:
  workflow_dispatch:
    inputs:
      deps_release_tag:
        description: Existing iOS deps release tag
        required: false
        default: main-iosport-ios-deps
  push:
    branches:
      - main-iosport
    paths:
      - .github/workflows/ios-ipa.yml
      - CMakeLists.txt
      - GNUmakefile
      - build_files/**
      - intern/ghost/**
      - release/ios/**
      - source/blender/gpu/metal/**
      - source/blender/windowmanager/**
      - source/creator/**
      - tools/ios/**

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  CACHE_VERSION: v1
  CACHE_FEATURES: ios-ipa-ninja-ccache-v1
  TARGET_DEVICE: ios
  HOST_BUILD_DIR: ${{ github.workspace }}/build_darwin
  APP_BUILD_DIR: ${{ github.workspace }}/build_ios_release
  DEPS_BUILD_DIR: ${{ github.workspace }}/build_deps_ios
  DEPS_INSTALL_DIR: ${{ github.workspace }}/lib/ios_arm64
  HOST_DEPS_INSTALL_DIR: ${{ github.workspace }}/lib/macos_arm64
  IOS_DEVICE_DEPS_RELEASE_TAG: ${{ github.event.inputs.deps_release_tag || format('{0}-ios-deps', github.ref_name) }}
  WITH_COMPILER_CCACHE: ON
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2000M

jobs:
  build-ipa:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: false

      - name: Compute required LFS cache key
        id: required-lfs-cache-key
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD:release/datafiles/startup.blend)" >> "$GITHUB_OUTPUT"

      - name: Restore required LFS assets cache
        id: required-lfs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .git/lfs/objects
            release/datafiles/startup.blend
          key: ${{ runner.os }}-required-lfs-${{ steps.required-lfs-cache-key.outputs.sha }}-v1

      - name: Fetch required LFS source assets
        run: |
          if [ "${{ steps.required-lfs-cache.outputs.cache-hit }}" != "true" ]; then
            git config lfs.remote.searchall true
            git remote get-url lfs-fallback >/dev/null 2>&1 || \
              git remote add lfs-fallback https://projects.blender.org/blender/blender.git
            git remote set-url --push lfs-fallback no_push
            git lfs fetch lfs-fallback --include="release/datafiles/startup.blend"
          fi
          git lfs pull --include="release/datafiles/startup.blend"

      - name: Save required LFS assets cache
        if: steps.required-lfs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .git/lfs/objects
            release/datafiles/startup.blend
          key: ${{ runner.os }}-required-lfs-${{ steps.required-lfs-cache-key.outputs.sha }}-v1

      - name: Compute host libs cache key
        id: host-libs-cache-key
        run: |
          printf 'sha=%s\n' "$(git rev-parse HEAD:lib/macos_arm64)" >> "$GITHUB_OUTPUT"

      - name: Restore host precompiled libs cache
        id: host-libs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            .git/modules/lib/macos_arm64
            lib/macos_arm64
          key: ${{ runner.os }}-host-libs-${{ steps.host-libs-cache-key.outputs.sha }}-v1

      - name: Fetch host precompiled libs
        if: steps.host-libs-cache.outputs.cache-hit != 'true'
        run: |
          python3 ./build_files/utils/make_update.py --no-blender

      - name: Save host precompiled libs cache
        if: steps.host-libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            .git/modules/lib/macos_arm64
            lib/macos_arm64
          key: ${{ runner.os }}-host-libs-${{ steps.host-libs-cache-key.outputs.sha }}-v1

      - name: Install build prerequisites
        run: |
          missing=()
          for pkg in autoconf automake bison ccache dos2unix flex libtool meson ninja pkg-config yasm; do
            brew list "$pkg" >/dev/null 2>&1 || missing+=("$pkg")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            HOMEBREW_NO_AUTO_UPDATE=1 brew install "${missing[@]}"
          fi
          mkdir -p "$HOME/.local/bin"
          ln -sf "$(command -v aclocal)" "$HOME/.local/bin/aclocal-1.16"
          ln -sf "$(command -v automake)" "$HOME/.local/bin/automake-1.16"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix bison)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix flex)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix libtool)/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          cmake --version
          ninja --version
          zip -v | head -n 2

      - name: Restore compiler cache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: ios-ipa-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'build_files/build_environment/**', 'intern/ghost/**', 'release/ios/**', 'source/blender/gpu/metal/**', 'source/blender/windowmanager/**', 'source/creator/**', 'tools/ios/**') }}
          restore-keys: |
            ios-ipa-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-

      - name: Configure compiler cache
        run: |
          ccache --version
          ccache --set-config=max_size="${CCACHE_MAXSIZE}"
          ccache --zero-stats || true

      - name: Restore host tools build cache
        id: restore-host-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.HOST_BUILD_DIR }}
          key: ios-ipa-host-tools-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**') }}

      - name: Build host tools
        if: steps.restore-host-tools-cache.outputs.cache-hit != 'true'
        run: |
          make tools \
            BUILD_DIR="${HOST_BUILD_DIR}" \
            BUILD_CMAKE_ARGS="-G Ninja -DWITH_COMPILER_CCACHE=YES"

      - name: Verify host tools
        run: |
          test -x "${HOST_BUILD_DIR}/bin/datatoc"
          test -x "${HOST_BUILD_DIR}/bin/shader_tool"
          test -x "${HOST_BUILD_DIR}/bin/makesdna"
          test -x "${HOST_BUILD_DIR}/bin/makesrna"
          test -x "${HOST_BUILD_DIR}/bin/msgfmt"

      - name: Save host tools build cache
        if: steps.restore-host-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.HOST_BUILD_DIR }}
          key: ios-ipa-host-tools-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'source/blender/blentranslation/msgfmt/**', 'source/blender/datatoc/**', 'source/blender/gpu/shader_tool/**', 'source/blender/makesdna/**', 'source/blender/makesrna/**') }}

      - name: Restore iOS deps source cache
        id: restore-deps-source-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ${{ env.DEPS_BUILD_DIR }}/downloads
            ${{ env.DEPS_BUILD_DIR }}/packages
          key: ios-ipa-deps-source-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('build_files/build_environment/cmake/download.cmake', 'build_files/build_environment/cmake/versions.cmake') }}
          restore-keys: |
            ios-ipa-deps-source-${{ env.CACHE_VERSION }}-${{ runner.os }}-

      - name: Configure iOS device dependency build
        env:
          APPLE_TARGET_DEVICE: ios
          APPLE_IOS_DEPS_BUILD_ROOT: ${{ env.DEPS_BUILD_DIR }}
          IOS_DEPS_RELEASE_TAG: ${{ env.IOS_DEVICE_DEPS_RELEASE_TAG }}
        run: |
          mkdir -p artifacts/ios-ipa/deps
          python3 tools/ios/build_deps.py --mode ios --configure-only \
            --generator Ninja \
            --build-dir "${DEPS_BUILD_DIR}" \
            --install-dir "${DEPS_INSTALL_DIR}" \
            --host-build-dir "${HOST_BUILD_DIR}" \
            --host-install-dir "${HOST_DEPS_INSTALL_DIR}" \
            --log-dir artifacts/ios-ipa/deps/configure-logs \
            --manifest-path artifacts/ios-ipa/deps/configure-manifest.json \
            --cmake-arg=-DWITH_COMPILER_CCACHE=ON

      - name: Build iOS device dependencies
        env:
          GH_TOKEN: ${{ github.token }}
          APPLE_TARGET_DEVICE: ios
          APPLE_IOS_DEPS_BUILD_ROOT: ${{ env.DEPS_BUILD_DIR }}
          IOS_DEPS_BUILD_DIR: ${{ env.DEPS_BUILD_DIR }}
          IOS_DEPS_INSTALL_DIR: ${{ env.DEPS_INSTALL_DIR }}
          IOS_HOST_BUILD_DIR: ${{ env.HOST_BUILD_DIR }}
          IOS_HOST_INSTALL_DIR: ${{ env.HOST_DEPS_INSTALL_DIR }}
          IOS_DEPS_RELEASE_TAG: ${{ env.IOS_DEVICE_DEPS_RELEASE_TAG }}
          IOS_DEPS_ARTIFACT_ROOT: artifacts/ios-ipa/deps
        run: |
          bash tools/ios/run_cached_deps_all.sh

      - name: Materialize iOS device dependency install tree
        run: |
          cmake --install "${DEPS_BUILD_DIR}"
          test -d "${DEPS_INSTALL_DIR}"
          test -d "${DEPS_INSTALL_DIR}/python"

      - name: Save iOS deps source cache
        if: always() && steps.restore-deps-source-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.DEPS_BUILD_DIR }}/downloads
            ${{ env.DEPS_BUILD_DIR }}/packages
          key: ios-ipa-deps-source-${{ env.CACHE_VERSION }}-${{ runner.os }}-${{ hashFiles('build_files/build_environment/cmake/download.cmake', 'build_files/build_environment/cmake/versions.cmake') }}

      - name: Build Blender for iOS
        run: |
          set -o pipefail
          mkdir -p artifacts/ios-ipa/app
          make release ios \
            BUILD_DIR="${APP_BUILD_DIR}" \
            BUILD_CMAKE_ARGS="-G Ninja -DWITH_COMPILER_CCACHE=YES -DBLENDER_HOST_TOOLS_DIR=${HOST_BUILD_DIR}/bin" \
            2>&1 | tee artifacts/ios-ipa/app/build.log

      - name: Package unsigned IPA
        run: |
          set -o pipefail
          make package_ipa BUILD_DIR="${APP_BUILD_DIR}"
          ls -lh "${APP_BUILD_DIR}/release"
          unzip -l "${APP_BUILD_DIR}"/release/*.ipa | sed -n '1,20p'
          shasum -a 256 "${APP_BUILD_DIR}"/release/*.ipa | tee artifacts/ios-ipa/app/ipa.sha256

      - name: Show compiler cache stats
        if: always()
        run: |
          ccache --show-stats || true

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ${{ env.CCACHE_DIR }}
          key: ios-ipa-ccache-${{ env.CACHE_VERSION }}-${{ env.CACHE_FEATURES }}-${{ runner.os }}-${{ hashFiles('CMakeLists.txt', 'GNUmakefile', 'build_files/cmake/**', 'build_files/build_environment/**', 'intern/ghost/**', 'release/ios/**', 'source/blender/gpu/metal/**', 'source/blender/windowmanager/**', 'source/creator/**', 'tools/ios/**') }}

      - name: Upload IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ios-unsigned-ipa
          if-no-files-found: error
          path: |
            ${{ env.APP_BUILD_DIR }}/release/*.ipa
            artifacts/ios-ipa/app/ipa.sha256

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: blender-ios-ipa-logs
          if-no-files-found: ignore
          path: |
            artifacts/ios-ipa/**/*.log
            artifacts/ios-ipa/**/*.json
            ${{ env.APP_BUILD_DIR }}/CMakeCache.txt
            ${{ env.APP_BUILD_DIR }}/CMakeFiles/CMakeError.log
            ${{ env.APP_BUILD_DIR }}/CMakeFiles/CMakeOutput.log
            ${{ env.DEPS_BUILD_DIR }}/CMakeCache.txt
            ${{ env.DEPS_BUILD_DIR }}/CMakeFiles/CMakeError.log
            ${{ env.DEPS_BUILD_DIR }}/CMakeFiles/CMakeOutput.log

      - name: Summarize outputs
        if: always()
        run: |
          echo "Target device: ${TARGET_DEVICE}"
          echo "Host tools cache hit: ${{ steps.restore-host-tools-cache.outputs.cache-hit }}"
          echo "Compiler cache hit: ${{ steps.restore-ccache.outputs.cache-hit }}"
          echo "Deps source cache hit: ${{ steps.restore-deps-source-cache.outputs.cache-hit }}"
          ls -lh "${APP_BUILD_DIR}/release" || true
