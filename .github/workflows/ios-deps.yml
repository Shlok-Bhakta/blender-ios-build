name: iOS Deps
'on':
  workflow_call: null
  workflow_dispatch: null
permissions:
  contents: write
jobs:
  ios-deps:
    runs-on: macos-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1
        lfs: false
    - name: Install iOS dependency prerequisites
      shell: bash
      env:
        HOMEBREW_NO_AUTO_UPDATE: '1'
      run: "set -euo pipefail\npackages=(\n  autoconf\n  automake\n  bison\n  dos2unix\n\
        \  flex\n  libtool\n  yasm\n)\nmissing=()\nfor package in \"${packages[@]}\"\
        ; do\n  if ! brew list --versions \"${package}\" >/dev/null 2>&1; then\n \
        \   missing+=(\"${package}\")\n  fi\ndone\nif [ \"${#missing[@]}\" -gt 0 ];\
        \ then\n  brew install \"${missing[@]}\"\nfi\necho \"$(brew --prefix bison)/bin\"\
        \ >> \"${GITHUB_PATH}\"\necho \"$(brew --prefix flex)/bin\" >> \"${GITHUB_PATH}\"\
        \necho \"$(brew --prefix libtool)/bin\" >> \"${GITHUB_PATH}\"\necho \"$(brew\
        \ --prefix libtool)/libexec/gnubin\" >> \"${GITHUB_PATH}\""
    - name: Compute host restore metadata
      shell: bash
      run: "mkdir -p artifacts/ios-deps/bootstrap\npython3 tools/ios/host_bootstrap.py\
        \ metadata --branch \"${GITHUB_REF_NAME}\" --stage python-llvm --output artifacts/ios-deps/bootstrap/bootstrap-metadata.json\n\
        python3 - <<'METADATA'\nimport json\nimport os\nfrom pathlib import Path\n\
        \nmetadata = json.loads(\n    Path('artifacts/ios-deps/bootstrap/bootstrap-metadata.json').read_text(encoding='ascii')\n\
        )\nversions_cmake = Path('build_files/build_environment/cmake/versions.cmake').read_text(encoding='utf-8')\n\
        ispc_version = None\nfor line in versions_cmake.splitlines():\n    if line.startswith('set(ISPC_VERSION\
        \ '):\n        ispc_version = line.split()[1].rstrip(')')\n        break\n\
        if ispc_version is None:\n    raise RuntimeError('Unable to determine ISPC_VERSION\
        \ from versions.cmake')\ngithub_env = Path(os.environ['GITHUB_ENV'])\nwith\
        \ github_env.open('a', encoding='ascii') as handle:\n    handle.write(f\"\
        HOST_BOOTSTRAP_RELEASE_TAG={metadata['release_tag']}\\n\")\n    handle.write(f\"\
        HOST_BOOTSTRAP_ASSET_NAME={metadata['asset_name']}\\n\")\n    handle.write(f\"\
        HOST_ISPC_RELEASE_ASSET_NAME=host-ispc-macos-arm64-{ispc_version}.tar.gz\\\
        n\")\nprint(f\"[bootstrap] release_tag={metadata['release_tag']}\")\nprint(f\"\
        [bootstrap] asset_name={metadata['asset_name']}\")\nprint(f\"[bootstrap] ispc_asset_name=host-ispc-macos-arm64-{ispc_version}.tar.gz\"\
        )\nMETADATA"
    - name: Restore host python and llvm build tree
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        download_dir="artifacts/ios-deps/bootstrap/download"

        mkdir -p "${download_dir}"

        gh release download "${HOST_BOOTSTRAP_RELEASE_TAG}" -R "${GITHUB_REPOSITORY}"
        -p "${HOST_BOOTSTRAP_ASSET_NAME}" -D "${download_dir}"

        python3 tools/ios/host_bootstrap.py extract --input "${download_dir}/${HOST_BOOTSTRAP_ASSET_NAME}"

        test -d build/ios-deps/host/Release/python

        test -d build/ios-deps/host/Release/llvm'
    - name: Restore host ISPC
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: 'set -euo pipefail

        download_dir="artifacts/ios-deps/ispc/download"

        mkdir -p "${download_dir}" "build/ios-deps/host/Release"

        gh release download "${HOST_BOOTSTRAP_RELEASE_TAG}" -R "${GITHUB_REPOSITORY}"
        -p "${HOST_ISPC_RELEASE_ASSET_NAME}" -D "${download_dir}"

        tar -xzf "${download_dir}/${HOST_ISPC_RELEASE_ASSET_NAME}" -C build/ios-deps/host/Release

        test -x build/ios-deps/host/Release/ispc/bin/ispc'
    - name: Configure iPhoneOS dependency build
      shell: bash
      run: 'mkdir -p artifacts/ios-deps

        set -euo pipefail

        python3 tools/ios/build_deps.py --mode ios --configure-only --build-dir build/ios-deps/ios
        --install-dir build/ios-deps/install/ios --host-build-dir build/ios-deps/host
        --host-install-dir build/ios-deps/install/host --log-dir artifacts/ios-deps/configure-logs
        --manifest-path artifacts/ios-deps/configure-manifest.json 2>&1 | tee artifacts/ios-deps/ios-configure-console.log'
    - name: Build zlib
      shell: bash
      run: echo "" && echo "============================================" && echo
        "[dep] === Building zlib ===" && echo "============================================"
        && bash tools/ios/run_release_cached_dep.sh "zlib" artifacts/ios-deps python3
        tools/ios/build_deps.py --mode ios --build-target "external_zlib" --build-dir
        build/ios-deps/ios --install-dir build/ios-deps/install/ios --host-build-dir
        build/ios-deps/host --host-install-dir build/ios-deps/install/host --log-dir
        "artifacts/ios-deps/zlib-logs" --manifest-path "artifacts/ios-deps/zlib-manifest.json"
    - name: Build openal
