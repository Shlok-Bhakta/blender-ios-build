    - name: Collect iOS dependency artifacts
      if: always()
      shell: bash
      run: "mkdir -p artifacts/ios-deps\nif [ -f build/ios-deps/ios/CMakeCache.txt\
        \ ]; then\n  cp build/ios-deps/ios/CMakeCache.txt artifacts/ios-deps/CMakeCache.txt\n\
        fi\nif [ -f build/ios-deps/ios/CMakeFiles/CMakeOutput.log ]; then\n  cp build/ios-deps/ios/CMakeFiles/CMakeOutput.log\
        \ artifacts/ios-deps/CMakeOutput.log\nfi\nif [ -f build/ios-deps/ios/CMakeFiles/CMakeError.log\
        \ ]; then\n  cp build/ios-deps/ios/CMakeFiles/CMakeError.log artifacts/ios-deps/CMakeError.log\n\
        fi\npython3 - <<'ARTIFACTS'\nfrom pathlib import Path\n\ndef write_tree(root:\
        \ Path, out: Path) -> None:\n    entries = []\n    if root.exists():\n   \
        \     for path in sorted(root.rglob('*')):\n            entries.append(str(path))\n\
        \    out.write_text('\\n'.join(entries) + ('\\n' if entries else ''), encoding='utf-8')\n\
        \nartifact_root = Path('artifacts/ios-deps')\nwrite_tree(Path('build/ios-deps/ios'),\
        \ artifact_root / 'ios-build-tree.txt')\nwrite_tree(Path('build/ios-deps/install/ios'),\
        \ artifact_root / 'ios-install-tree.txt')\nwrite_tree(Path('build/ios-deps/host/Release'),\
        \ artifact_root / 'host-release-tree.txt')\nARTIFACTS"
    - name: Upload iOS dependency artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-deps-${{ github.run_id }}
        path: artifacts/ios-deps
        retention-days: 14

